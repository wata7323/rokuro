function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function rgba(c,f,a){f=f===undefined?1:f;a=a===undefined?1:a;return 'rgba('+Math.min(255,c[0]*f|0)+','+Math.min(255,c[1]*f|0)+','+Math.min(255,c[2]*f|0)+','+a+')';}
function roundSig(p,d){if(p<10000)return Math.round(p);const e=Math.floor(Math.log10(p))-(d-1);const m=Math.pow(10,e);return Math.round(p/m)*m;}

/* =========================================================

const glCv=$('gl'),fxCv=$('fx'),fx=fxCv.getContext('2d');

   行列ユーティリティ
   ========================================================= */
const M4={
  persp(fovy,aspect,near,far,shift){
    const f=1/Math.tan(fovy/2),nf=1/(near-far),m=new Float32Array(16);
    m[0]=f/aspect;m[5]=f;m[10]=(far+near)*nf;m[11]=-1;m[14]=2*far*near*nf;m[9]=-shift;
    return m;
  },
  lookAt(e,t,u){
    let zx=e[0]-t[0],zy=e[1]-t[1],zz=e[2]-t[2];let l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
    let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;
    const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
    const m=new Float32Array(16);
    m[0]=xx;m[1]=yx;m[2]=zx;m[4]=xy;m[5]=yy;m[6]=zy;m[8]=xz;m[9]=yz;m[10]=zz;
    m[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);m[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);m[14]=-(zx*e[0]+zy*e[1]+zz*e[2]);m[15]=1;
    return m;
  },
  mul(a,b){
    const o=new Float32Array(16);
    for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}
    return o;
  }
};
function makeCam(){return {D:400,ty:55,shift:0,fovy:0.5,el:0.3,aspect:1,eye:[0,0,400],target:[0,55,0],vp:null};}
function camUpdateVP(c){
  c.eye=[0,c.ty+c.D*Math.sin(c.el),c.D*Math.cos(c.el)];
  c.target=[0,c.ty,0];
  c.vp=M4.mul(M4.persp(c.fovy,c.aspect,5,6000,c.shift),M4.lookAt(c.eye,c.target,[0,1,0]));
}
function projectWith(c,x,y,z,w,h){
  const m=c.vp;
  const cx=m[0]*x+m[4]*y+m[8]*z+m[12],cy=m[1]*x+m[5]*y+m[9]*z+m[13],cw=m[3]*x+m[7]*y+m[11]*z+m[15];
  return [(cx/cw+1)/2*w,(1-cy/cw)/2*h];
}

const SEG=64,PROF_MAX=200;
const COS=new Float32Array(SEG+1),SIN=new Float32Array(SEG+1);
for(let j=0;j<=SEG;j++){const a=j/SEG*Math.PI*2;COS[j]=Math.cos(a);SIN[j]=Math.sin(a);}

function buildProfile(st){
  const r=st.r,t=st.t,lh=st.lh,P=[];
  P.push([r[0],0,0,0]);
  for(let k=0;k<N;k++)P.push([r[k],(k+0.5)*lh,k,0]);
  const topY=N*lh,rT=r[N-1];
  P.push([rT,topY,N-1,0]);
  let ds=N;
  for(let k=N-1;k>=0;k--){if(r[k]-t[k]>0.5)ds=k;else break;}
  if(ds<N){
    const riT=Math.max(0.3,r[N-1]-t[N-1]);
    const cr=(rT-riT)/2,cxr=(rT+riT)/2,lipH=Math.min(cr,2.5);
    for(let i=1;i<=5;i++){const a=i/6*Math.PI;P.push([cxr+Math.cos(a)*cr,topY+Math.sin(a)*lipH,N-1,0]);}
    P.push([riT,topY,N-1,1]);
    for(let k=N-1;k>=ds;k--)P.push([Math.max(0.3,r[k]-t[k]),(k+0.5)*lh,k,1]);
    const yf=ds*lh;
    P.push([Math.max(0.3,r[ds]-t[ds]),yf,ds,1]);
    P.push([Math.max(0.3,r[ds]-t[ds])*0.5,yf,ds,1]);
    P.push([0,yf,ds,1]);
  }else{
    P.push([rT*0.7,topY+Math.min(rT*0.12,4),N-1,0]);
    P.push([0,topY+Math.min(rT*0.16,5),N-1,0]);
  }
  return P;
}

function createRenderer(canvas,preserve){

    const P=buildProfile(st),np=Math.min(P.length,PROF_MAX);

      let nr=pn[1]-pp[1],ny=-(pn[0]-pp[0]);const l=Math.hypot(nr,ny)||1;nr/=l;ny/=l;

        vbuf[o++]=nr*COS[j];vbuf[o++]=ny;vbuf[o++]=nr*SIN[j];

  function draw(o){

    gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(U.uVP,false,o.cam.vp);
    gl.uniform3f(U.uEye,o.cam.eye[0],o.cam.eye[1],o.cam.eye[2]);
    gl.uniform1f(U.uRot,-o.theta);
    gl.uniform1f(U.uBlur,o.blur);
    gl.uniform1f(U.uHeat,o.heat);
    gl.uniform1f(U.uMode,o.mode);
    gl.uniform1f(U.uTime,o.time);

  let midMax=0;for(let k=Math.floor(N*0.2);k<Math.ceil(N*0.8);k++)if(r[k]>midMax)midMax=r[k];
  let bumps=0;
  for(let k=4;k<N-4;k++){
    if(r[k]>r[k-1]&&r[k]>=r[k+1]){
      let lo1=r[k],lo2=r[k];
      for(let j=1;j<=4;j++){lo1=Math.min(lo1,r[k-j]);lo2=Math.min(lo2,r[k+j]);}
      if(r[k]-Math.max(lo1,lo2)>2.5)bumps++;
    }
  }
  const Htot=lh*N;
  return {Htot,maxR,minR,minRmid,maxOff,hollowFrac:hollowN/(N-3),avgT:hollowN?sumT/hollowN:null,minT:hollowN?minT:null,
    wob:wobS/N,smooth:sm,waist:waistAbs/Math.max(1,maxR),topR,botR,midMax,bumps,depthFrac:depth/N,aspect:Htot/(2*Math.max(1,maxR))};
}
// 形の指標（0〜1）。上位3つで形の正体と得点が決まる
const IDX=[
  {k:'tall',   n:'高さ',    noun:'塔',      A:'重力を無視した',     B:'バベルの', f:m=>(m.Htot-110)/255},
  {k:'wide',   n:'幅',      noun:'大皿',    A:'大地を覆う',         B:'大海の',   f:m=>(m.maxR-55)/82},
  {k:'thin',   n:'薄さ',    noun:'薄手茶碗',A:null,                 B:'透ける',   f:m=>m.avgT?m.hollowFrac*(1-Math.log10(m.avgT/TMIN)/2.3):0},
  {k:'waist',  n:'くびれ',  noun:'徳利',    A:'艶めかしくくびれた', B:'砂時計の', f:m=>m.waist*1.35},
  {k:'flare',  n:'口広がり',noun:'朝顔鉢',  A:'天に開いた',         B:'朝顔の',   f:m=>(m.topR-m.botR)/(m.topR+1)*1.38},
  {k:'closed', n:'すぼまり',noun:'壺',      A:'口を閉ざした',       B:'秘密の',   f:m=>(m.maxR-m.topR)/Math.max(1,m.maxR)*1.32},
  {k:'bulge',  n:'胴張り',  noun:'甕',      A:'腹の出た',           B:'布袋の',   f:m=>(m.midMax-Math.max(m.topR,m.botR))/Math.max(1,m.maxR)*1.49},
  {k:'flat',   n:'平たさ',  noun:'平皿',    A:'地を這う',           B:'凪の',     f:m=>(0.75-m.aspect)/0.21},
  {k:'slender',n:'細長さ',  noun:'一輪挿し',A:'針のような',         B:'細雪の',   f:m=>(m.aspect-1.3)/6.4},
  {k:'ridge',  n:'うねり',  noun:'段花入',  A:'波打つ',             B:'鳴門の',   f:m=>m.bumps/5},
  {k:'twist',  n:'歪み',    noun:'呪物',    A:'遠心力でねじれた',   B:'暴走',     f:m=>m.wob*3.5}
];
function shapeEval(m){
  const all=IDX.map(d=>{const raw=d.f(m)||0;return {d,raw,v:clamp(raw,0,1)};}).sort((a,b)=>b.raw-a.raw);
  const top=all.slice(0,3);
  const score=top[0].v*0.45+top[1].v*0.33+top[2].v*0.22;
  const keys=top.map(t=>t.d.k);
  const smoothF=(keys[0]==='ridge'||keys[0]==='twist')?1:Math.exp(-Math.max(0,m.smooth-0.6)*(keys.indexOf('ridge')>0?0.45:0.9));
  const symF=keys[0]==='twist'?1:Math.exp(-m.wob*(keys.indexOf('twist')>0?2:4));
  // うねり・歪みが主役の器は仕上げ減点を免除するが、満点にはしない
  const craft=(keys[0]==='ridge'||keys[0]==='twist')?Math.min(0.92,smoothF*symF):smoothF*symF;
  return {all,top,score,craft,q:clamp(score*craft,0,1)};
}
// 共鳴は「良い形を保った時間」で溜まる。品質qが高いほど速く溜まり、qが低すぎると抜けていく。崩壊で失う
const RES_UP=0.25,RES_Q0=0.35,RES_Q1=0.75;
function resonance(sh){return sh?sh.q:0;}
function chargeRes(s,dt){
  if(s.collapsed){s.res=Math.max(0,s.res-dt*1.5);return;}
  const g=(s.q-RES_Q0)/(RES_Q1-RES_Q0);
  s.res=clamp(s.res+dt*(g>0?RES_UP*Math.min(1.25,g):0.5*Math.max(-1,g)),0,1);
}
// 特異点圏：品質（形×仕上げ）0.8以上・95,000RPM以上・崩壊していない
const ZONE_Q=0.8;
function inZone(s){return !s.collapsed&&s.shape&&s.q>=ZONE_Q&&s.rpm>=95000;}

/* =========================================================
   入力 → 粘土変形（指の位置＝輪郭）
   ========================================================= */
function applyPointer(p,dt){
  const mp=screenToModel(p.x,p.y);
  const dyUp=p.py-p.y;p.py=p.y;
  if(!mp)return false;
  return applyModel(mp.x,mp.y,dyUp,dt);
}
// 指1本ぶんの変形（mx,my：モデル座標mm / dyUp：画面上で上へ動いた量px）
function applyModel(mx,my,dyUp,dt){
  const s=S;
  const mp={x:mx,y:my};
  const Ht=s.lh*N;
  const d=Math.min(150,Math.abs(mp.x));
  if(mp.y>Ht-1){
    // 縁より上：上へなぞると引き上げ（肉厚を薄くして背を伸ばす）
    if(mp.y>Ht+120||d>s.r[N-1]+80)return false;
    if(dyUp>0){
      const f=Math.max(0.8,1-dyUp*0.0045*(1+s.rpmF));
      for(let k=3;k<N;k++){if(s.r[k]-s.t[k]>0.5)s.t[k]=Math.max(TMIN,s.t[k]*f);}
      clayAct+=dyUp/Math.max(dt,0.001)/700;clayH=Math.max(clayH,1);
      if(Math.random()<0.8){
        const sp=project(s.r[N-1]*(Math.random()<0.5?-1:1),Ht,0);
        particles.push({type:'slip',x:sp[0],y:sp[1],vx:(Math.random()-0.5)*160,vy:-80-Math.random()*160,life:0.6,max:0.6,size:1.5+Math.random()*2.5});
      }
    }
    for(let k=N-6;k<N;k++)s.off[k]*=Math.exp(-dt*6);
    for(let k=N-10;k<N;k++)s.sup[k]=Math.max(s.sup[k],(k-(N-10))/9);
    return true;
  }
  if(mp.y<-15)return false;
  const jf=mp.y/s.lh-0.5;
  const rate=9+12*s.rpmF;
  const a=1-Math.exp(-rate*dt);
  const sig=Math.max(1.5,8/s.lh);
  const span=Math.ceil(sig*2.6);
  const jc=clamp(Math.round(jf),0,N-1);
  const tg=clamp(d,RMIN,150);
  let moved=0;
  for(let k=jc-span*2;k<=jc+span*2;k++){if(k>=0&&k<N){const ws=Math.exp(-((k-jf)*(k-jf))/(8*sig*sig));s.sup[k]=Math.max(s.sup[k],0.5*ws);s.off[k]*=Math.exp(-dt*5*ws);}}
  for(let k=jc-span;k<=jc+span;k++){
    if(k<0||k>=N)continue;
    const w=Math.exp(-((k-jf)*(k-jf))/(2*sig*sig));
    const aw=a*w;
    const wasSolid=s.t[k]>=s.r[k]-0.01||k<3;
    const dr=(tg-s.r[k])*aw;
    s.r[k]+=dr;
    if(wasSolid)s.t[k]=s.r[k];
    else if(dr>0)s.t[k]=Math.max(TMIN,s.t[k]-dr*0.35);
    else s.t[k]=Math.min(s.r[k],s.t[k]-dr*0.08);
    const viol=Math.max(0,Math.abs(dr)-60*dt);   // 60mm/s を超える激しい動き
    s.off[k]*=Math.exp(-dt*(viol>0?2:(d<=s.r[jc]+15?14:8))*w);
    s.sup[k]=Math.max(s.sup[k],Math.min(1,w*1.6));
    s.off[k]+=(Math.abs(dr)*0.15+viol*1.2)*s.rpmF*s.rpmF;
    moved+=Math.abs(dr);
  }
  clayAct+=moved/Math.max(dt,0.001)/70;clayH=Math.max(clayH,clamp(mp.y/Math.max(1,Ht),0,1));
  if(moved>0.15&&Math.random()<0.5+s.rpmF){
    const side=mp.x<0?-1:1,sp=project(mp.x,mp.y,0);
    particles.push({type:'slip',x:sp[0],y:sp[1],vx:side*(60+Math.random()*200*(1+s.rpmF*3)),vy:-60-Math.random()*160,life:0.5+Math.random()*0.4,max:0.9,size:1.5+Math.random()*3});
  }
  return true;
}

/* =========================================================
   物理（遠心力・軸ブレ・平滑化・体積保存）
   ========================================================= */
function physics(dt,touched){
  const s=S;
  // 遠心力は指で触れている間だけ効く（放置ではぶっ飛ばない）。崩壊後の歪みは回転だけで進む
  // 触れている間は全開。高回転域(rpmF>0.45)では指を離していても弱い遠心力が働き、芯がブレていく
  const F=s.collapsed?Math.pow(s.rpmF,3):touched?Math.pow(s.rpmF,3)*0.6:((s.rpmF>0.45&&!s.bonus)?Math.pow(s.rpmF,3)*0.35:0);
  const rCap=s.collapsed?130:220;
  for(let k=0;k<N;k++){
    const solid=s.t[k]>=s.r[k]-0.01||k<3;
    const thinF=clamp(14/(s.t[k]+4),0.5,2.5);
    const hF=0.5+k/N;
    const g=s.collapsed?0.25:1;
    const free=1-0.9*s.sup[k];
    const dr=s.r[k]*F*0.3*thinF*hF*dt*g*free;
    s.r[k]+=dr;
    if(solid)s.t[k]=s.r[k];else s.t[k]=Math.max(TMIN,s.t[k]-dr*0.2);
    s.off[k]+=F*dt*(s.off[k]*0.5*thinF*hF+Math.random()*2*hF)*free;
    if(touched)s.off[k]+=s.rpmF*dt*Math.random()*0.2;
    s.ph[k]+=F*dt*(k/N)*3*(s.collapsed?2.5:1);
  }
  const rr=Float32Array.from(s.r),oo=Float32Array.from(s.off);
  const kd=(touched||s.collapsed)?Math.min(0.45,dt*3):0;
  for(let k=1;k<N-1;k++){
    const solid=s.t[k]>=s.r[k]-0.01;
    s.r[k]+=(rr[k-1]+rr[k+1]-2*rr[k])*kd*0.5;
    s.off[k]+=(oo[k-1]+oo[k+1]-2*oo[k])*kd*0.5;
    if(solid)s.t[k]=s.r[k];
  }
  for(let k=0;k<N;k++){
    s.r[k]=clamp(s.r[k],RMIN,rCap);
    if(k<3)s.t[k]=s.r[k];
    s.t[k]=clamp(s.t[k],TMIN,s.r[k]);
    s.off[k]=clamp(s.off[k],0,120);
  }
  if(!s.collapsed){
    let A=0;for(let k=0;k<N;k++){const ri=Math.max(0,s.r[k]-s.t[k]);A+=s.r[k]*s.r[k]-ri*ri;}
    const tgt=LH0*clamp(Math.pow(s.A0/Math.max(1,A),0.35),0.3,4.2);
    s.lh+=(tgt-s.lh)*(1-Math.exp(-dt*6));
    if(s.phase==='play')checkCollapse();
  }else{
    s.collapseT+=dt;
    if(s.collapseT<1.5){
      const old=s.lh,lhT=LH0*0.5;
      s.lh+=(lhT-s.lh)*(1-Math.exp(-dt*5));
      const f=Math.sqrt(old/s.lh);
      for(let k=0;k<N;k++){
        s.r[k]=Math.min(rCap,s.r[k]*Math.pow(f,0.6+0.8*(1-k/N))*(1+(Math.random()-0.5)*0.05));
        s.t[k]=s.r[k];
        s.off[k]+=dt*Math.random()*28*(k/N);
      }
    }
  }
  let ao=0;for(let k=0;k<N;k++)ao+=s.off[k];s.avgOff=ao/N;
}
function checkCollapse(){
  if(DBG.noCollapse||S.bonus)return;
  const s=S;let reason='';
  if(s.lh*N>430)reason='高さの限界';
  let above=0;
  if(!reason){
    for(let k=N-1;k>=0;k--){
      const ri=Math.max(0,s.r[k]-s.t[k]);
      const a=s.r[k]*s.r[k]-ri*ri;
      if(s.off[k]>s.r[k]*0.9+6){reason='軸ブレ崩壊';break;}
      if(s.r[k]>170){reason='遠心力で飛散';break;}
      if(k<N-3&&above/Math.max(a,1)>900){reason='首折れ';break;}
      above+=a;
    }
  }
  if(reason)collapse(reason);
}
function collapse(reason){
  const s=S;
  s.collapsed=true;s.collapseReason=reason;s.collapseT=0;s.shake=16;s.chaos=0;
  sfx.crash();
  const Ht=s.lh*N;
  for(let i=0;i<40;i++){
    const c=project((Math.random()-0.5)*120,Ht*Math.random(),0);
    particles.push({type:'chunk',x:c[0],y:c[1],vx:(Math.random()-0.5)*900,vy:-200-Math.random()*500,life:1.6,max:1.6,size:4+Math.random()*12,rot:Math.random()*6,vr:(Math.random()-0.5)*14});
  }
}
const BONUS_AT=8;
function startBonus(){
  const s=S;
  s.bonus=true;
  goSingular();
  s.shake=26;
}
function goSingular(){
  const s=S;
  s.singular=true;s.shake=22;
  sfx.fanfare();
  const c=project(0,30,0);
  for(let i=0;i<120;i++){
    const a=Math.random()*Math.PI*2,v=200+Math.random()*900;
    particles.push({type:'spark',x:c[0],y:c[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1.2,max:1.2,size:2+Math.random()*4,hue:Math.random()*360});
  }
}

/* =========================================================
   時価計算
   ========================================================= */
function priceMult(rpmF){return 1+40*rpmF*rpmF;}
const SING_MIN=850000000,SING_BASE=9999999999;
function singScore(s){
  const sh=s.shape||shapeEval(s.m||metrics(s));
  // 圏内に居続けた時間ぶん青天井に伸びる
  return Math.max(0,0.45*clamp(s.q,0,1)+0.35*clamp((s.q-ZONE_Q)/(1-ZONE_Q),0,1)+(s.bonus?0.2:0)+0.07*s.zoneTime);
}
function singPrice(sp,prog){
  return SING_MIN*Math.pow(SING_BASE/SING_MIN,(prog===undefined?1:prog)*Math.pow(sp,1.2));
}
function singRank(v){return v>=5e9?'創世の特異点':(v>=2e9?'神域の特異点':'前衛の特異点');}
function computePrice(dt){
  const s=S;let p;
  const m=metrics(s);s.m=m;s.wob=m.wob;
  const sh=shapeEval(m);s.shape=sh;
  if(s.bonus){
    s.q=Math.max(s.q,sh.q);
    const prog=clamp((s.elapsed-BONUS_AT)/(PLAY_TIME-BONUS_AT),0,1);
    p=singPrice(singScore(s),prog)*(1+(Math.random()-0.5)*0.01);
  }else if(s.collapsed){
    p=4;
  }else{
    s.q+=(sh.q-s.q)*(1-Math.exp(-dt/0.35));const q=s.q;
    const base=Math.pow(10,1.5+6.5*Math.pow(q,1.1));
    const jit=1+Math.sin(T*9.3)*0.015+Math.sin(T*23.1)*0.01+(Math.random()-0.5)*0.06*s.rpmF;
    p=base*priceMult(s.rpmF)*jit;
  }
  s.priceTarget=Math.max(4,Math.round(p));
  const lt=Math.log10(s.priceTarget);
  const fast=(lt<s.logD-1)?16:7;
  s.logD+=(lt-s.logD)*(1-Math.exp(-dt*fast));
  if(s.logD-s.lastPing>0.07){
    if(T-s.lastCoinT>0.045){sfx.coin(s.logD);s.lastCoinT=T;}
    s.lastPing=s.logD;
  }else if(s.logD<s.lastPing-0.07){
    s.lastPing=s.logD;
  }
}
// 焼成時の確定価格
function firePrice(s){
  if(s.bonus)return {price:Math.max(SING_MIN,roundSig(s.priceTarget,4)),sing:true};
  if(inZone(s)&&s.started&&(s.elapsed>=PLAY_TIME-1||DBG.ignoreTime))return {price:Math.max(SING_MIN,roundSig(singPrice(singScore(s)),4)),sing:true};
  if(s.collapsed)return {price:4,sing:false};
  return {price:Math.max(4,roundSig(s.priceTarget,4)),sing:false};
}
// 1フレーム分の進行（回転・入力・物理・価格）。inputs はモデル座標の指 [{x,y,dy}]
function simStep(dt,inputs){
  const s=S;
  chargeRes(s,dt);
  const tr=DBG.rpm||RPM_MIN*Math.pow(RPM_MAX/RPM_MIN,Math.pow(s.res,1.3));
  let lr=Math.log(s.rpm);const lt=Math.log(tr);
  lr+=(lt-lr)*(1-Math.exp(-dt*(lt>lr?1.6:4)));
  s.rpm=Math.exp(lr);
  s.rpmF=clamp(Math.log(s.rpm/RPM_MIN)/Math.log(RPM_MAX/RPM_MIN),0,1);
  if(s.rpm>s.rpmMax)s.rpmMax=s.rpm;
  let stop=0;for(let i=0;i<STOPS.length;i++){if(s.rpmF>=STOPS[i]-0.002)stop=i;}
  if(stop>s.lastStop){sfx.gear(stop);s.shake=Math.max(s.shake,4+stop*4);}
  s.lastStop=stop;
  s.theta+=dt*Math.PI*2*(0.6+s.rpmF*2.4);
  if(s.started&&!DBG.freeze)s.elapsed+=dt;
  if(s.started&&!s.check8&&s.elapsed>=BONUS_AT){s.check8=true;if(inZone(s))startBonus();}
  let touched=false;
  s.sup.fill(0);
  clayAct=0;clayH=0;
  for(const p of pointers.values()){if(applyPointer(p,dt))touched=true;}
  for(const q of inputs){if(applyModel(q.x,q.y,q.dy,dt))touched=true;}
  audioClay(clayAct,s.rpmF,clayH);
  if(touched&&!s.started)startTimer();
  physics(dt,touched);
  computePrice(dt);
  s.zone=inZone(s);
  if(s.zone||s.bonus)s.zoneTime+=dt;
}
/*SIM-END*/
function displayPrice(){
  const s=S;
  const lt=Math.log10(s.priceTarget);
  const diff=Math.abs(lt-s.logD);
  let v=diff<0.004?s.priceTarget:Math.round(Math.pow(10,s.logD));
  v=Math.max(4,v);
  let str=String(v);
  if(diff>0.01&&str.length>1){
    const n=Math.min(str.length-1,1+Math.floor(diff*8));
    let tail='';for(let i=0;i<n;i++)tail+=Math.floor(Math.random()*10);
    str=str.slice(0,str.length-n)+tail;
  }
  return {str:Number(str).toLocaleString('ja-JP'),val:v};
}
function liveRank(v){
  const s=S;
  if(s.singular)return singRank(v);
  if(s.collapsed)return '産業廃棄物';
  if(v>=1e8)return '人間国宝';
  if(v>=1e7)return '重要文化財';
  if(v>=1e6)return '名品';
  if(v>=1e4)return '民芸品';
  return '泥塊';
}

/* =========================================================
   焼成
   ========================================================= */
function startTimer(){
  const s=S;if(s.started)return;
  s.started=true;s.elapsed=0;
  hintEl.style.display='none';
  $('zbtn').style.display='none';
  $('rsbtn').style.display='block';
  sfx.click();
}
function fire(){
  const s=S;if(s.phase!=='play')return;
  audioInit();
  s.phase='firing';s.fireT=0;
  const fr=firePrice(s);
  if(fr.sing)goSingular();
  const fp=fr.price;
  s.final={price:fp,r:Float32Array.from(s.r),t:Float32Array.from(s.t),off:Float32Array.from(s.off),ph:Float32Array.from(s.ph),
    lh:s.lh,rpm:s.rpm,rpmMax:Math.max(s.rpmMax,s.rpm),collapsed:s.collapsed,singular:s.singular,reason:s.collapseReason,q:s.q,chaos:s.chaos,theta:s.theta};
  sfx.explosion();
  shojiClose(false);shojiEl.classList.add('glow');
  s.shake=20;
  pointers.clear();
  ctrlEl.style.visibility='hidden';
  $('rsbtn').style.display='none';
  hintEl.style.display='none';
  const c=project(0,s.lh*N*0.5,0);
  for(let i=0;i<70;i++){
    const a=Math.random()*Math.PI*2,v=150+Math.random()*700;
    particles.push({type:'spark',x:c[0],y:c[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.9,max:0.9,size:2+Math.random()*4,hue:20+Math.random()*30});
  }
}

/* =========================================================
   パーティクル
   ========================================================= */
function spawnLeaf(){
  particles.push({type:'leaf',x:Math.random()*W,y:-20,vx:(Math.random()-0.5)*40,vy:45+Math.random()*80,rot:Math.random()*6,vr:(Math.random()-0.5)*8,flip:Math.random()*6,vf:4+Math.random()*7,size:5+Math.random()*10,life:9,max:9});
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.type==='leaf'){
      p.x+=p.vx*dt+Math.sin(T*2+p.rot)*24*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.flip+=p.vf*dt;
      if(p.y>H+30)p.life=0;
    }else if(p.type==='slip'||p.type==='chunk'){
      p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!==undefined)p.rot+=p.vr*dt;
    }else if(p.type==='spark'){
      p.vx*=Math.exp(-dt*2);p.vy*=Math.exp(-dt*2);p.vy+=200*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    if(p.life<=0)particles.splice(i,1);
  }
  if(particles.length>700)particles.splice(0,particles.length-700);
}
function drawParticles(){
  const g=fx;
  for(const p of particles){
    const al=clamp(p.life/p.max,0,1);
    if(p.type==='leaf'){
      const c=Math.cos(p.flip);
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,c);
      g.fillStyle=Math.abs(c)<0.25?'#fff6d2':(c>0?'#d9ad2b':'#b8861a');
      g.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.8);
      g.restore();
    }else if(p.type==='slip'){
      g.fillStyle='rgba(120,66,34,'+al+')';
      g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill();
    }else if(p.type==='chunk'){
      g.save();g.translate(p.x,p.y);g.rotate(p.rot);
      g.fillStyle='rgba(98,54,28,'+al+')';
      g.beginPath();g.moveTo(-p.size,0);g.lineTo(-p.size*0.3,-p.size*0.8);g.lineTo(p.size*0.9,-p.size*0.3);g.lineTo(p.size*0.5,p.size*0.7);g.closePath();g.fill();
      g.restore();
    }else if(p.type==='spark'){
      g.fillStyle='hsla('+p.hue+',90%,55%,'+al+')';
      g.beginPath();g.arc(p.x,p.y,p.size,0,Math.PI*2);g.fill();
    }
  }
}

/* =========================================================
   2D フォールバック描画（WebGL 非対応端末用）
   ========================================================= */
function drawWheel2D(){
  const g=fx,cx=L.cx,by=L.baseY,wr=L.wheelR,ry=wr*0.17,s=S;
  g.fillStyle='#3a2414';
  g.beginPath();g.moveTo(cx-wr*0.42,by+ry);g.lineTo(cx+wr*0.42,by+ry);g.lineTo(cx+wr*0.62,H+10);g.lineTo(cx-wr*0.62,H+10);g.closePath();g.fill();
  g.fillStyle='#2e1b0f';g.beginPath();g.ellipse(cx,by+ry*0.7,wr,ry,0,0,Math.PI*2);g.fill();g.fillRect(cx-wr,by,wr*2,ry*0.7);
  g.fillStyle='#3b2516';g.beginPath();g.ellipse(cx,by,wr,ry,0,0,Math.PI*2);g.fill();
  g.strokeStyle='rgba(255,230,190,.22)';g.lineWidth=2;
  for(let i=0;i<10;i++){const a=s.theta+i*0.628;g.beginPath();g.ellipse(cx,by,wr*0.88,ry*0.88,0,a,a+0.12+s.rpmF*0.5);g.stroke();}
}
function drawClay2D(){
  const g=fx,s=S,sc=L.sc,cx=L.cx,by=L.baseY,lh=s.lh*sc;
  const D=[92,44,20],M=[170,100,58],Lt=[226,160,112];
  let topX=cx;
  for(let k=0;k<N;k++){
    const rr=s.r[k]*sc;
    const ox=cx+s.off[k]*Math.cos(s.theta+s.ph[k])*sc;
    const y=by-(k+1)*lh;
    const gr=g.createLinearGradient(ox-rr,0,ox+rr,0);
    gr.addColorStop(0,rgba(D));gr.addColorStop(0.3,rgba(M));gr.addColorStop(0.38,rgba(Lt));gr.addColorStop(0.5,rgba(M));gr.addColorStop(1,rgba(D,0.8));
    g.fillStyle=gr;g.fillRect(ox-rr,y,rr*2,lh+0.9);
    if(k===N-1)topX=ox;
  }
  const rr=s.r[N-1]*sc,ri=Math.max(0,s.r[N-1]-s.t[N-1])*sc,ty=by-N*lh;
  g.fillStyle=rgba(Lt);g.beginPath();g.ellipse(topX,ty,Math.max(0.1,rr),Math.max(0.1,rr*0.17),0,0,Math.PI*2);g.fill();
  if(ri>0.4){g.fillStyle='#2a1206';g.beginPath();g.ellipse(topX,ty,ri,Math.max(0.1,ri*0.17),0,0,Math.PI*2);g.fill();}
}

/* =========================================================
   描画
   ========================================================= */
function render(){
  const s=S;
  if(s.phase==='result'&&s.revealT>0.8)return;
  if(R){
    R.draw({st:s,theta:s.theta,cam,w:glCv.width,h:glCv.height,blur:s.phase==='play'?Math.pow(s.rpmF,1.3):0,
      heat:s.phase==='play'?0:clamp(s.fireT/0.4,0,1),mode:(s.singular||s.zone)?4:0,time:T,seed:1.37,wheel:true,wet:1});
  }
  fx.clearRect(0,0,W,H);
  if(!R){drawWheel2D();drawClay2D();}
  // 回転の気配（墨の集中線）
  if(s.rpmF>0.3&&s.phase==='play'){
    const c=project(0,s.lh*N*0.5,0);
    fx.save();fx.globalAlpha=Math.min(0.35,(s.rpmF-0.3)*0.5);
    fx.strokeStyle=s.singular?'#f1ece4':'#1b1814';fx.lineWidth=1;
    for(let i=0;i<36;i++){
      const a=Math.random()*Math.PI*2,r0=Math.max(W,H)*(0.3+Math.random()*0.2),r1=r0+50+Math.random()*220*s.rpmF;
      fx.beginPath();fx.moveTo(c[0]+Math.cos(a)*r0,c[1]+Math.sin(a)*r0);fx.lineTo(c[0]+Math.cos(a)*r1,c[1]+Math.sin(a)*r1);fx.stroke();
    }
    fx.restore();
  }
  // なぞり方ガイド
  if(!s.started&&s.phase==='play'&&pointers.size===0){
    const u=(T*0.45)%1.25;
    const Ht=s.lh*N;
    fx.save();
    if(u<1){
      const k=Math.min(N-1,Math.floor(u*N));
      const pr=s.r[k]+4+Math.sin(u*Math.PI)*-10;
      const p=project(pr,(k+0.5)*s.lh,0);
      fx.strokeStyle='rgba(27,24,20,.55)';fx.setLineDash([3,4]);fx.lineWidth=1;
      fx.beginPath();
      for(let i=0;i<=k;i+=2){const q=project(s.r[i]+4+Math.sin((i/N)*Math.PI)*-10,(i+0.5)*s.lh,0);if(i===0)fx.moveTo(q[0],q[1]);else fx.lineTo(q[0],q[1]);}
      fx.stroke();fx.setLineDash([]);
      fx.fillStyle='rgba(27,24,20,.85)';fx.beginPath();fx.arc(p[0],p[1],7,0,Math.PI*2);fx.fill();
      fx.strokeStyle='rgba(27,24,20,.5)';fx.beginPath();fx.arc(p[0],p[1],13,0,Math.PI*2);fx.stroke();
    }else{
      const v=(u-1)/0.25;
      const p=project(s.r[N-1]*0.8,Ht+5+v*40,0);
      fx.fillStyle='rgba(27,24,20,'+(0.85*(1-v))+')';fx.beginPath();fx.arc(p[0],p[1],7,0,Math.PI*2);fx.fill();
    }
    fx.restore();
  }
  drawParticles();
  for(const p of pointers.values()){
    fx.strokeStyle=s.singular?'rgba(241,236,228,.85)':'rgba(27,24,20,.75)';fx.lineWidth=1.5;
    fx.beginPath();fx.arc(p.x,p.y,16,0,Math.PI*2);fx.stroke();
    fx.beginPath();fx.moveTo(p.x-22,p.y);fx.lineTo(p.x-10,p.y);fx.moveTo(p.x+10,p.y);fx.lineTo(p.x+22,p.y);fx.stroke();
  }
  // TAS再生中は仮想の指も同じ照準で描く（動画撮影用）
  if(TAS.on&&s.phase==='play'){
    for(const q of TAS.inputs){
      const sp=project(q.x,q.y,0);
      fx.strokeStyle=s.singular?'rgba(241,236,228,.85)':'rgba(27,24,20,.75)';fx.lineWidth=1.5;
      fx.beginPath();fx.arc(sp[0],sp[1],16,0,Math.PI*2);fx.stroke();
      fx.beginPath();fx.moveTo(sp[0]-22,sp[1]);fx.lineTo(sp[0]-10,sp[1]);fx.moveTo(sp[0]+10,sp[1]);fx.lineTo(sp[0]+22,sp[1]);fx.stroke();
    }
  }
}

  else if(!s.started)st='';
  else if(s.wob>0.15)st='軸ブレ';

  else if(s.rpmF>0.3)st='共鳴';
  if(st!==lastStatus){statusEl.textContent=st;lastStatus=st;}
  const body=s.singular?'sing':(s.collapsed?'crash':(dp.val>=1e7?'rich':''));
  if(body!==lastBody){document.body.className=body;lastBody=body;}
  const rem=s.started?Math.max(0,PLAY_TIME-s.elapsed):PLAY_TIME;

const GLAZE={
  yohen:{code:1,d:[8,6,14],m:[26,20,38],l:[80,70,110],gloss:0.45,inner:'#05040a',name:'曜変天目釉'},
  seiji:{code:2,d:[58,100,90],m:[130,182,164],l:[214,240,228],gloss:0.5,inner:'#3d6b60',name:'青磁釉'},
  koge:{code:3,d:[4,3,2],m:[24,17,12],l:[60,46,36],gloss:0.08,inner:'#000',name:'炭化（黒焦げ）'},
  sing:{code:4,d:[10,10,10],m:[120,80,200],l:[255,240,200],gloss:0.55,inner:'#000',name:'虹彩金属釉（解析不能）'},
  oribe:{code:5,d:[22,52,26],m:[58,118,56],l:[150,196,120],gloss:0.4,inner:'#1d3a1f',name:'織部釉'},

  tsuchi:{code:7,d:[64,36,20],m:[138,86,50],l:[196,140,94],gloss:0.15,inner:'#3a200f',name:'自然釉（灰被り）'}
};
function idxStat(k,m,f){
  const x=v=>'×'+v.toFixed(1);
  switch(k){
    case 'tall':return ['高さ',Math.round(m.Htot)+'mm'];
    case 'wide':return ['径',Math.round(m.maxR*2)+'mm'];
    case 'thin':return ['最薄',(m.minT===null?'-':m.minT.toFixed(1))+'mm'];
    case 'waist':return ['くびれ',x(m.maxR/Math.max(1,m.minRmid))];
    case 'flare':return ['口／底',x(m.topR/Math.max(1,m.botR))];
    case 'closed':return ['胴／口',x(m.maxR/Math.max(1,m.topR))];
    case 'bulge':return ['胴張り',x(m.midMax/Math.max(1,Math.max(m.topR,m.botR)))];
    case 'flat':return ['径／高さ',x(2*m.maxR/Math.max(1,m.Htot))];
    case 'slender':return ['高さ／径',x(m.Htot/Math.max(1,2*m.maxR))];
    case 'ridge':return ['うねり',m.bumps+'段'];
    default:return ['軸ブレ',Math.round(m.maxOff)+'mm'];
  }
}
function appraise(f,m){
  const seed=hashStr([m.Htot.toFixed(1),m.maxR.toFixed(1),m.minR.toFixed(1),m.wob.toFixed(3),Math.round(f.rpmMax),f.price].join('|'));
  const pick=(arr,salt)=>arr[hashStr(seed+':'+salt)%arr.length];
  const hollow=m.depthFrac>0.15;
  const man=v=>v>=10000?(Math.round(v/10000)+'万'):(v>=1000?(Math.round(v/1000)+'千'):String(Math.round(v)));
  let glaze;
  if(f.singular)glaze='sing';
  else if(f.collapsed)glaze='koge';
  else if(f.rpmMax>=4500&&((m.minT!==null&&m.minT<3)||f.q>0.6))glaze='yohen';
  else if(f.q>0.5)glaze='seiji';
  else if(m.wob>0.1||m.bumps>=2)glaze='oribe';
  else if(m.aspect<0.6)glaze='shino';
  else glaze='tsuchi';
  const sh=shapeEval(m);
  const t3=sh.top.map(t=>t.d);
  const adj=d=>d.k==='thin'?('厚さ'+(m.minT===null?'?':m.minT.toFixed(1))+'mmの'):d.A;
  let kind,A,B;
  if(f.collapsed&&!f.singular){
    kind=m.Htot<60?'灰皿':'泥塊';
    A=f.rpmMax>=20000?'遠心力でねじれた':'自重に敗れた';
    B='虚無の';
  }else if(f.singular){
    kind=t3[0].noun;A=man(f.rpmMax)+'回転の';B='暴走';
  }else if(sh.score<0.2){
    kind=hollow?'湯呑':'泥塊';
    A=pick(['静寂を纏う','端正なる','素朴なる','名もなき'],'a');
    B=pick(['信楽','備前','伊賀'],'b');
  }else{
    kind=t3[0].noun;A=adj(t3[1]);B=t3[2].B;
  }
  const name=A+B+kind;
  const shapeLabel=t3.map(d=>d.n).join('・');
  let rank;
  if(f.singular)rank=singRank(f.price);
  else if(f.collapsed)rank=f.rpmMax>=20000?'遠心力の犠牲者':'ただの泥塊';
  else if(f.price>=1e8)rank='人間国宝';
  else if(f.price>=1e7)rank='重要文化財';
  else if(f.price>=1e6)rank='名品';
  else if(f.price>=1e4)rank='民芸品';
  else rank='ただの泥塊';
  const COMMENT={
    '人間国宝':'一切の迷いなき轆轤目。国の宝として永久保存を推奨する。',
    '重要文化財':'後世に伝えるべき造形美。美術館級の逸品である。',
    '名品':'確かな手応えのある佳品。床の間映え必至。',
    '民芸品':'素朴な味わい。道の駅で静かに輝くだろう。',
    'ただの泥塊':'土に還ることを推奨する。',
    '遠心力の犠牲者':'遠心力に魂ごと持っていかれた。合掌。',
    '前衛の特異点':'物理法則を超越した造形。美術史が書き換わった。',
    '神域の特異点':'人の手が届いてよい領域ではない。直ちに封印を推奨する。',
    '創世の特異点':'この器から新たな宇宙が始まった。鑑定不能につき仮額とする。'
  };
  let sub='（税込・桐箱付）';
  if(f.collapsed&&!f.singular)sub='（産業廃棄物）';
  else if(f.singular)sub='（前衛芸術の特異点）';
  else if(f.price<1e4)sub='（ほぼ土代）';
  const serial=String(seed%1000000).padStart(6,'0');
  const SHAPE_COMMENT={
    tall:'天を突く危うい均衡。',wide:'大地を覆う圧倒的な広がり。',thin:'光が透ける極限の薄さ。',
    waist:'息を呑むくびれの妙。',flare:'天へ開く大胆な口造り。',closed:'秘密を閉じ込めた口元。',
    bulge:'豊かに張った胴の量感。',flat:'地を這う潔い低さ。',slender:'針のごとき細身の緊張。',
    ridge:'波打つ稜線の律動。',twist:'三半規管を揺さぶる歪み。'
  };
  const comment=(sh.score>=0.2?SHAPE_COMMENT[t3[0].k]:'')+COMMENT[rank];
  return {seed,glaze,kind,name,rank,comment,sub,serial,hollow,shapeLabel,top:t3,score:sh.score};
}

   鑑定書カード描画

const CW=1080,CH=1440;
cardCv.width=CW;cardCv.height=CH;
let cardBase=null,cardInfo=null,sealCv=null;
const CL={priceX:430,priceY:1020,sealX:860,sealY:975,sealS:230};

function fitFont(g,text,maxW,size,weight,family){
  let s=size;
  g.font=weight+' '+s+'px '+family;
  while(g.measureText(text).width>maxW&&s>10){s-=2;g.font=weight+' '+s+'px '+family;}
  return s;
}
function grain(g,x,y,w,h,rnd,col){
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  for(let i=0;i<26;i++){
    const y0=y+rnd()*h,f=0.01+rnd()*0.03,ph=rnd()*6,amp=1+rnd()*4;
    g.strokeStyle=col+(0.1+rnd()*0.22)+')';g.lineWidth=0.6+rnd()*1.6;
    g.beginPath();g.moveTo(x,y0);
    for(let xx=x;xx<=x+w;xx+=12)g.lineTo(xx,y0+Math.sin(xx*f+ph)*amp);
    g.stroke();
  }
  g.restore();
}
function polyCrack(g,x,y,n,len,rnd){
  g.beginPath();g.moveTo(x,y);
  let a=rnd()*Math.PI*2;
  for(let i=0;i<n;i++){a+=(rnd()-0.5)*1.6;x+=Math.cos(a)*len*(0.5+rnd());y+=Math.sin(a)*len*(0.5+rnd());g.lineTo(x,y);}
  g.stroke();
}
function smoothOx(f){
  const ox=new Float32Array(N);
  for(let k=0;k<N;k++)ox[k]=f.off[k]*Math.cos(f.ph[k]);
  for(let pass=0;pass<3;pass++){
    const o=Float32Array.from(ox);
    for(let k=0;k<N;k++){const a=o[Math.max(0,k-1)],b=o[Math.min(N-1,k+1)];ox[k]=(a+o[k]*2+b)/4;}
  }
  return ox;
}
// WebGL で釉薬付きの器を描画し、カードへ貼る
function drawVessel3D(g,f,cx,baseY,maxW,maxH,glaze,seed){
  const r2=getR2();if(!r2)return false;
  const w=r2.canvas.width,h=r2.canvas.height;
  const c=makeCam();
  const Ht=f.lh*N;let ext=0;
  for(let k=0;k<N;k++)ext=Math.max(ext,f.r[k]+f.off[k]);
  c.aspect=w/h;c.el=0.32;c.fovy=0.45;c.shift=0;
  const tanY=Math.tan(c.fovy/2);
  c.ty=Ht*0.5;
  c.D=Math.max((Ht*1.12+ext*0.6)/2/tanY/0.92,ext*1.15/(tanY*c.aspect));
  camUpdateVP(c);
  r2.draw({st:f,theta:0.6,cam:c,w,h,blur:0,heat:0,mode:GLAZE[glaze].code,time:(seed%997)/10,seed:(seed%1000)/37,wheel:false,wet:0.35});
  const b=projectWith(c,0,0,0,w,h);
  const tp=projectWith(c,0,Ht,0,w,h);
  const sd=projectWith(c,ext,Ht*0.5,0,w,h);
  const mid=projectWith(c,0,Ht*0.5,0,w,h);
  const pxH=Math.max(10,b[1]-tp[1]+ext*0.1),pxW=Math.max(10,(sd[0]-mid[0])*2);
  const s=Math.min(maxW/pxW,maxH/pxH,2.2);
  g.fillStyle='rgba(30,0,5,.45)';
  g.beginPath();g.ellipse(cx,baseY+2,Math.max(2,f.r[0]*s*(pxW/(2*ext))*1.15),Math.max(2,f.r[0]*s*(pxW/(2*ext))*0.22),0,0,Math.PI*2);g.fill();
  g.drawImage(r2.canvas,cx-b[0]*s,baseY-b[1]*s,w*s,h*s);
  return true;
}
function drawVessel2D(g,f,cx,baseY,maxW,maxH,glaze,rnd){
  const r=f.r,t=f.t,lh=f.lh;
  const ox=smoothOx(f);let ext=1;
  for(let k=0;k<N;k++)ext=Math.max(ext,Math.abs(ox[k])+r[k]);
  const Ht=lh*N;
  const sc=Math.min(maxH/(Ht+ext*0.2),maxW/(2*ext),3.6);
  const X=k=>cx+ox[k]*sc;
  const ly=k=>baseY-(k+0.5)*lh*sc;
  const pal=GLAZE[glaze];

  g.lineTo(X(N-1)+r[N-1]*sc,topY);
  for(let k=N-1;k>=0;k--)g.lineTo(X(k)+r[k]*sc,ly(k));

function drawSection(g,f,m,x,y,w,h){
  g.fillStyle='#fbf7ee';g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(150,110,60,.18)';g.lineWidth=1;
  for(let gx=x;gx<=x+w;gx+=16){g.beginPath();g.moveTo(gx,y);g.lineTo(gx,y+h);g.stroke();}
  for(let gy=y;gy<=y+h;gy+=16){g.beginPath();g.moveTo(x,gy);g.lineTo(x+w,gy);g.stroke();}
  g.strokeStyle='#8a5a2a';g.lineWidth=2;g.strokeRect(x,y,w,h);
  g.fillStyle='#3a1f0e';g.textAlign='left';g.textBaseline='alphabetic';
  g.font='900 24px '+MINCHO;g.fillText('断面図',x+12,y+32);
  g.font='600 12px '+GOTHIC;g.fillStyle='#8a5a2a';g.fillText('CROSS SECTION',x+92,y+31);
  const r=f.r,t=f.t,lh=f.lh;
  const ox=smoothOx(f);let ext=1;
  for(let k=0;k<N;k++)ext=Math.max(ext,Math.abs(ox[k])+r[k]);
  const Ht=lh*N;
  const aw=w-36,ah=h-90;
  const sc=Math.min(ah/Ht,aw/(2*ext),3.2);
  const cx=x+w/2,by=y+h-34;
  const pc=document.createElement('canvas');pc.width=10;pc.height=10;
  const pg=pc.getContext('2d');pg.fillStyle='#c99a6a';pg.fillRect(0,0,10,10);pg.strokeStyle='#7a4a24';pg.lineWidth=1.4;
  pg.beginPath();pg.moveTo(0,10);pg.lineTo(10,0);pg.moveTo(-5,5);pg.lineTo(5,-5);pg.moveTo(5,15);pg.lineTo(15,5);pg.stroke();
  g.fillStyle=g.createPattern(pc,'repeat');
  for(let k=0;k<N;k++){
    const yk=by-(k+1)*lh*sc,hk=lh*sc+0.7,ri=Math.max(0,r[k]-t[k]),xc=cx+ox[k]*sc;
    if(ri>0.3){
      const ww=Math.max(0.9,(r[k]-ri)*sc);
      g.fillRect(xc-r[k]*sc,yk,ww,hk);
      g.fillRect(xc+ri*sc,yk,ww,hk);
    }else{
      g.fillRect(xc-r[k]*sc,yk,r[k]*sc*2,hk);
    }
  }
  g.strokeStyle='#3a1f0e';g.lineWidth=1.6;
  [-1,1].forEach(sd=>{
    g.beginPath();
    for(let k=0;k<N;k++){const xx=cx+ox[k]*sc+sd*r[k]*sc,yy=by-(k+0.5)*lh*sc;if(k===0)g.moveTo(xx,by);g.lineTo(xx,yy);}
    g.stroke();
  });
  g.strokeStyle='#c8161d';g.setLineDash([6,4]);g.lineWidth=1.2;
  g.beginPath();g.moveTo(cx,by+10);g.lineTo(cx,by-Ht*sc-14);g.stroke();g.setLineDash([]);
  g.strokeStyle='#3a1f0e';g.lineWidth=2;g.beginPath();g.moveTo(x+10,by);g.lineTo(x+w-10,by);g.stroke();
  g.fillStyle='#3a1f0e';g.font='700 15px '+GOTHIC;g.textAlign='center';
  g.fillText('高 '+Math.round(Ht)+'mm ／ 径 '+Math.round(m.maxR*2)+'mm',cx,y+h-12);
  if(m.minT!==null){
    let kk=-1;for(let k=3;k<N;k++){if(r[k]-t[k]>0.5&&Math.abs(t[k]-m.minT)<1e-4){kk=k;break;}}
    if(kk>=0){
      const yy=by-(kk+0.5)*lh*sc,xx=cx+ox[kk]*sc+r[kk]*sc;
      g.strokeStyle='#c8161d';g.lineWidth=1.5;
      g.beginPath();g.moveTo(xx,yy);g.lineTo(Math.min(x+w-60,xx+24),yy-26);g.stroke();
      g.fillStyle='#c8161d';g.font='800 14px '+GOTHIC;g.textAlign='left';
      g.fillText('最薄 '+m.minT.toFixed(1)+'mm',Math.min(x+w-96,xx+18),yy-30);
    }
  }
}
function makeSeal(text,size,seed){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');const rnd=mulberry32(seed^0x5eed);
  g.fillStyle='#c8161d';
  const j=()=>(rnd()-0.5)*size*0.03;
  const p=size*0.04;
  g.beginPath();
  g.moveTo(p+j(),p+j());g.lineTo(size-p+j(),p+j());g.lineTo(size-p+j(),size-p+j());g.lineTo(p+j(),size-p+j());g.closePath();g.fill();
  const chars=Array.from(text);const n=chars.length;
  const cols=n<=3?1:2,rows=Math.ceil(n/cols);
  const pad=size*0.13,inner=size-pad*2,cw=inner/cols,ch=inner/rows;
  const fs=Math.min(cw,ch)*0.9;
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='900 '+fs+'px '+MINCHO;
  for(let i=0;i<n;i++){
    const col=Math.floor(i/rows),row=i%rows;
    const xx=size-pad-(col+0.5)*cw,yy=pad+(row+0.5)*ch;
    g.save();g.translate(xx,yy);
    g.scale(Math.min(1.6,cw/fs*0.92),1);
    g.fillText(chars[i],0,0);g.restore();
  }
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<260;i++){
    g.fillStyle='rgba(0,0,0,'+(0.3+rnd()*0.7)+')';
    g.beginPath();g.arc(rnd()*size,rnd()*size,0.5+rnd()*2.4,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<30;i++){
    const e=rnd()*4|0,v=rnd()*size;
    const xx=e===0?v:(e===1?v:(e===2?p:size-p)),yy=e===0?p:(e===1?size-p:v);
    g.beginPath();g.arc(xx,yy,2+rnd()*6,0,Math.PI*2);g.fill();
  }
  g.globalCompositeOperation='source-over';
  return c;
}

function updateResult(dt){
  const s=S,f=s.final;
  s.revealT+=dt;
  if(!s.landed){
    if(s.revealT<1.12){
      if(s.revealT-s.lastTick>0.06){s.lastTick=s.revealT;sfx.tick();}
      const lg=Math.log10(Math.max(4,f.price));
      const v=Math.floor(Math.pow(10,Math.random()*(lg+0.8)));
      renderCard(Math.max(1,v),false,0);
    }else if(s.revealT<1.4){
      // 静寂のタメ（音も表示も止める）
    }else{
      s.landed=true;s.stampStart=s.revealT;
      audioDuck(false);
      sfx.kaan();sfx.doon(0.13);
      cardCv.classList.remove('slam');void cardCv.offsetWidth;cardCv.classList.add('slam');
      renderCard(f.price,true,0);
    }
  }else if(!s.blobbing){
    const sp=clamp((s.revealT-s.stampStart)/0.22,0,1);
    renderCard(f.price,true,sp);
    if(sp>=1){
      s.blobbing=true;
      cardCv.toBlob(b=>{resultBlob=b;xBtn.disabled=false;saveBtn.disabled=false;},'image/png');
    }
  }
}

function drawSil(cv,prof,mode){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height;
  g.clearRect(0,0,w,h);
  const n=prof.r.length;let ext=1;
  for(let i=0;i<n;i++)ext=Math.max(ext,Math.abs(prof.x[i])+prof.r[i]);
  const sc=Math.min(w*0.86/(2*ext),h*0.84/prof.H);
  const cx=w/2,by=h*0.93;
  const X=i=>cx+prof.x[i]*sc,Y=i=>by-(i/(n-1))*prof.H*sc;
  g.beginPath();
  g.moveTo(X(0)-prof.r[0]*sc,by);
  for(let i=0;i<n;i++)g.lineTo(X(i)-prof.r[i]*sc,Y(i));
  for(let i=n-1;i>=0;i--)g.lineTo(X(i)+prof.r[i]*sc,Y(i));
  g.closePath();
  if(mode==='own'){g.fillStyle='#1b1814';g.fill();}
  else{g.setLineDash([4,4]);g.strokeStyle='rgba(27,24,20,.4)';g.lineWidth=1.5;g.stroke();g.setLineDash([]);}
  g.strokeStyle='rgba(27,24,20,.25)';g.lineWidth=1;g.beginPath();g.moveTo(w*0.12,by+0.5);g.lineTo(w*0.88,by+0.5);g.stroke();
}

/* =========================================================
   TAS（理想入力の自動再生）
   実際のタッチと同じ applyPointer 経路に、毎フレーム理想の指位置を流し込む
   ========================================================= */
const TAS={on:false,name:'',plan:null,t:0,log:[],nextLog:0,result:null,inputs:[]};
// 超人TASの制御則（ブラウザにもそのまま移植する）
// P: {rc:[9点の目標半径], H:目標高さ, T:目標肉厚, amp,fq:うねり, eps:許容誤差, hold:0/1 誤差内での添え方, t0:成形開始}
function tasProfile(P,u){
  const n=P.rc.length-1,x=u*n,i=Math.min(n-1,Math.floor(x)),f=x-i;
  const p0=P.rc[Math.max(0,i-1)],p1=P.rc[i],p2=P.rc[i+1],p3=P.rc[Math.min(n,i+2)];
  // Catmull-Rom
  const v=0.5*((2*p1)+(-p0+p2)*f+(2*p0-5*p1+4*p2-p3)*f*f+(-p0+3*p1-3*p2+p3)*f*f*f);
  return v+(P.amp||0)*Math.sin(u*Math.PI*2*(P.fq||4));
}
function tasControl(s,P,t,dt,K){
  const N=K.N,lh=s.lh,Ht=lh*N,out=[];
  // 目標輪郭と誤差
  let sumT=0,nh=0;
  for(let k=3;k<N;k++){if(s.r[k]-s.t[k]>0.5){sumT+=s.t[k];nh++;}}
  const avgT=nh?sumT/nh:99;
  const rate=9+12*s.rpmF,a=1-Math.exp(-rate*dt);
  const sig=Math.max(1.5,8/lh),gap=Math.ceil(sig*2.6);
  const err=new Float32Array(N);
  for(let k=0;k<N;k++){const tg=Math.max(K.RMIN,tasProfile(P,k/(N-1)));err[k]=tg-s.r[k];}
  // 指1：背が足りず壁が厚いうちは引き上げ（必要な分だけ正確に薄くする）
  let fingers=P.nf||2;
  // 高さの限界(430mm)には近づかない
  const HT=Math.min(P.H,405);
  if(Ht<HT-2&&avgT>Math.max(K.TMIN,P.T)*1.02){
    const need=Math.max(0.8,Math.max(K.TMIN,P.T)/avgT);
    const ratioH=Math.min(1,(HT-Ht)/40);
    const f=1-(1-need)*Math.max(0.15,ratioH);
    const dy=(1-f)/(0.0045*(1+s.rpmF));
    out.push({x:s.r[N-1]*0.9,y:Ht+6,dy:dy});
    fingers--;
  }
  if(t<(P.t0||0))return out;
  // 手放し：この時刻以降は指を離して回転に任せる
  if(P.tr!==undefined&&P.tr<10&&t>=P.tr){
    if(!(P.sh>0))return [];
    // こねくり：高さを往復しながら指を内外に揺らす
    const k=Math.max(0,Math.min(N-1,Math.floor((0.5+0.45*Math.sin(t*3))*N)));
    return [{x:Math.max(K.RMIN,s.r[k]+P.sh*Math.sin(t*Math.PI*2*8)),y:(k+0.5)*lh,dy:0}];
  }
  // 残りの指：誤差最大の層へ、1フレームで目標に届く位置を押さえる（デッドビート）
  const used=[];
  for(let i=0;i<fingers;i++){
    let best=-1,bv=P.eps||0.5;
    for(let k=0;k<N;k++){
      if(used.some(j=>Math.abs(j-k)<gap*1.2))continue;
      const v=Math.abs(err[k])*(1+0.15*(s.off[k]||0));
      if(v>bv){bv=v;best=k;}
    }
    if(best<0){
      if(P.hold&&i===0){
        // 誤差内：芯ブレの最も大きい層に指を添える
        let bk=0,bo=-1;for(let k=0;k<N;k++){const o=s.off[k]*(0.5+k/N);if(o>bo){bo=o;bk=k;}}
        out.push({x:s.r[bk],y:(bk+0.5)*lh,dy:0});
      }
      break;
    }
    used.push(best);
    const tgt=Math.max(K.RMIN,tasProfile(P,best/(N-1)));
    // 1フレームの変形量を芯が外れない速さ（55mm/s）以内に収める
    const lim=55*dt*Math.max(1,(1-s.rpmF)*8);
    const step=Math.max(-lim,Math.min(lim,(tgt-s.r[best])*(P.gain||1)));
    const x=Math.min(150,Math.max(K.RMIN,s.r[best]+step/a));
    out.push({x:x,y:(best+0.5)*lh,dy:0});
  }
  return out;
}

const DBG={on:false,el:null,out:null,freeze:false,noCollapse:false,ignoreTime:false,rpm:0};
function dbgSetShape(rf,tf,height){
  const s=S;
  for(let k=0;k<N;k++){
    const u=k/(N-1);
    s.r[k]=Math.max(RMIN,rf(u));
    s.t[k]=k<3?s.r[k]:Math.min(s.r[k],tf(u));
    s.off[k]=0.2;
  }
  let A=0;for(let k=0;k<N;k++){const ri=Math.max(0,s.r[k]-s.t[k]);A+=s.r[k]*s.r[k]-ri*ri;}
  const lhT=height/N;
  s.A0=A*Math.pow(lhT/LH0,1/0.35);
  s.lh=lhT;
  s.collapsed=false;s.collapseReason='';
  if(!s.started){s.started=true;s.elapsed=0;hintEl.style.display='none';}
}

  const glaze=fired?cardInfo.glaze:'yohen';
  const seed=fired?cardInfo.seed:20250101;
  const rnd=mulberry32(seed^0x0a9);

  const vg=g.createRadialGradient(OW*0.62,OH*0.45,80,OW*0.5,OH*0.5,OW*0.75);

    const x=rnd()*OW,y=rnd()*OH,l=4+rnd()*22,a=rnd()*Math.PI;
    g.strokeStyle='rgba(120,98,70,'+(0.04+rnd()*0.08)+')';g.lineWidth=0.4+rnd()*0.8;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  // 金赤の二重枠
  g.strokeStyle='#8a1c14';g.lineWidth=8;g.strokeRect(20,20,OW-40,OH-40);
  g.strokeStyle='#b8902e';g.lineWidth=2;g.strokeRect(36,36,OW-72,OH-72);
  g.fillStyle='#8a1c14';
  [[20,20],[OW-20,20],[20,OH-20],[OW-20,OH-20]].forEach(q=>{g.save();g.translate(q[0],q[1]);g.rotate(Math.PI/4);g.fillRect(-10,-10,20,20);g.restore();});
  // 展示台
  const sx=66,sy=66,sw=540,sh=OH-132;
  const stg=g.createLinearGradient(0,sy,0,sy+sh);stg.addColorStop(0,'#3b3631');stg.addColorStop(0.7,'#26221e');stg.addColorStop(1,'#1a1714');
  g.fillStyle=stg;g.fillRect(sx,sy,sw,sh);
  const bcx=sx+150,base=sy+sh-62;
  const spot=g.createRadialGradient(bcx,base-150,10,bcx,base-120,sh*0.75);
  spot.addColorStop(0,'rgba(255,246,226,.42)');spot.addColorStop(1,'rgba(255,235,190,0)');
  g.fillStyle=spot;g.fillRect(sx,sy,sw,sh);
  g.fillStyle='rgba(255,240,200,.06)';
  g.beginPath();g.moveTo(bcx-30,sy);g.lineTo(bcx+30,sy);g.lineTo(bcx+200,sy+sh);g.lineTo(bcx-200,sy+sh);g.closePath();g.fill();
  // 台座
  g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.ellipse(bcx,base+26,130,12,0,0,Math.PI*2);g.fill();
  const pd=g.createLinearGradient(0,base,0,base+28);pd.addColorStop(0,'#5a3a26');pd.addColorStop(1,'#2e1c12');
  g.fillStyle=pd;g.fillRect(bcx-120,base+2,240,24);
  g.fillStyle='#6d4a32';g.beginPath();g.ellipse(bcx,base+2,120,9,0,0,Math.PI*2);g.fill();
  // 器（3D、無理なら2D）
  if(!drawVessel3D(g,f,bcx,base,250,sh-150,glaze,seed))drawVessel2D(g,f,bcx,base,240,sh-160,glaze,rnd);
  g.strokeStyle='#b8902e';g.lineWidth=2;g.strokeRect(sx,sy,sw,sh);
  // 断面図
  drawSection(g,f,metrics(f),sx+sw-226-14,sy+14,226,sh-28);
  // 文字
  const tx=sx+sw+40,tw=OW-66-tx-20;
  g.textAlign='left';g.textBaseline='alphabetic';
  g.fillStyle='#8a5a2a';g.font='700 20px '+MINCHO;
  g.fillText('十秒暴走轆轤　特別展',tx,118);
  g.fillStyle='#1b1814';
  fitFont(g,'10秒暴走ろくろ',tw,104,'900',MINCHO);g.fillText('10秒暴走ろくろ',tx-4,230);
  g.fillStyle='#c8371a';g.fillRect(tx,256,tw,4);
  g.fillStyle='#2a160c';
  fitFont(g,'人間国宝か、時価4円の泥塊か',tw,42,'800',MINCHO);g.fillText('人間国宝か、時価4円の泥塊か',tx,316);
  // 価格の対比
  g.fillStyle='#c8371a';
  const ps=fitFont(g,'¥9,999,999,999',tw,68,'900',MINCHO);g.fillText('¥9,999,999,999',tx,398);
  g.fillStyle='#6e6458';g.font='700 '+Math.round(ps*0.6)+'px '+MINCHO;g.fillText('↔',tx+2,398+ps*1.05);
  g.fillStyle='#1b1814';g.font='900 '+ps+'px '+MINCHO;g.fillText('¥4',tx+ps*0.85,398+ps*1.1);
  g.fillStyle='#6e6458';g.font='600 21px '+MINCHO;
  g.fillText('指でなぞって十秒。最高 99,999 rpm。',tx,OH-104);
  if(fired){g.fillStyle='#8a5a2a';g.font='700 18px '+MINCHO;fitFont(g,'出品作「'+cardInfo.name+'」',tw-130,18,'700',MINCHO);g.fillText('出品作「'+cardInfo.name+'」',tx,OH-74);}
  // 落款
  const seal=makeSeal('暴走',112,seed);
  g.save();g.translate(OW-66-112-6,OH-66-112-8);g.rotate(-0.04);g.drawImage(seal,0,0);g.restore();
  // 保存
  c.toBlob(b=>{
    if(!b){toast('OGP画像を作れませんでした');return;}
    const a=document.createElement('a'),u=URL.createObjectURL(b);
    a.href=u;a.download='ogp.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),3000);
    toast('ogp.png を保存しました');
  },'image/png');
  return c;
}
function dbgBuild(){
  const el=document.createElement('div');
  el.id='dbg-panel';
  el.style.cssText='position:fixed;right:6px;top:70px;z-index:60;width:212px;max-height:calc(100vh - 80px);overflow-y:auto;background:rgba(20,18,16,.88);color:#e8e2d6;font:11px/1.45 ui-monospace,Consolas,monospace;padding:8px;touch-action:manipulation;user-select:none';
  const btns=[['freeze','時間停止'],['noCollapse','崩壊無効'],['ignoreTime','特異点の時間条件無視'],['rpm','回転固定'],
    ['vase','形:花瓶'],['dish','形:大皿'],['jar','形:壺'],['bowl','形:茶碗'],['collapse','崩壊させる'],['last','残り1秒へ'],['fire','即焼成'],['retry','リセット'],['ogp','OGP画像(1200×630)保存']];
  el.innerHTML='<div style="font-weight:700;margin-bottom:4px">DEBUG <span style="opacity:.6">( ` で閉じる)</span></div>'+
    // TAS：系統ごとに直接選ぶ
    '<div style="font-weight:700;margin:2px 0 3px">TAS <span style="opacity:.6">（押すとその動きで最初から）</span></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">'+
    Object.keys(TAS_PLANS).map((k,i)=>{const ix=IDX.find(d=>d.k===k);
      return '<button data-tas="'+k+'" style="padding:5px 4px;font:inherit;background:#3a3631;color:#fff;border:0;cursor:pointer;text-align:left">'+
        '<span style="opacity:.55">'+(i<10?i:String.fromCharCode(55+i))+'</span> '+TAS_PLANS[k].label+(ix?'<span style="opacity:.6">・'+ix.n+'</span>':'')+'</button>';}).join('')+
    '</div><div style="margin-top:3px"><button data-a="tasAgain" style="margin:0 3px 0 0;padding:4px 6px;font:inherit;background:#3a3631;color:#fff;border:0;cursor:pointer">もう一度</button>'+
    '<button data-a="tasStop" style="padding:4px 6px;font:inherit;background:#3a3631;color:#fff;border:0;cursor:pointer">止めて自分で触る</button></div>'+
    '<div style="height:8px"></div><pre id="dbg-out" style="margin:0 0 6px;white-space:pre-wrap;font:inherit"></pre>'+
    btns.map(b=>'<button data-a="'+b[0]+'" style="display:inline-block;margin:0 3px 3px 0;padding:4px 6px;font:inherit;background:#3a3631;color:#fff;border:0;cursor:pointer">'+b[1]+'</button>').join('');
  el.addEventListener('pointerdown',e=>e.stopPropagation());
  el.addEventListener('click',e=>{
    const b=e.target&&e.target.closest&&e.target.closest('button');if(!b)return;
    const a=b.getAttribute('data-a'),t=b.getAttribute('data-tas');
    if(a&&DBG_ACTIONS[a]){audioInit();DBG_ACTIONS[a]();}
    else if(t&&TAS_PLANS[t]){audioInit();tasStart(t);}
  });
  document.body.appendChild(el);
  DBG.el=el;DBG.out=el.querySelector('#dbg-out');
}
function dbgToggle(force){
  DBG.on=force===undefined?!DBG.on:force;
  if(DBG.on&&!DBG.el)dbgBuild();
  if(DBG.el)DBG.el.style.display=DBG.on?'block':'none';
}
function dbgUpdate(){
  if(!DBG.on||!DBG.out||!S)return;
  const s=S,m=s.m||metrics(s);
  const ok=v=>v?'○':'×';
  const lines=[
    'phase   '+s.phase+(s.collapsed?' / 崩壊:'+s.collapseReason:'')+(s.bonus?' / ボーナス中':''),
    '8秒判定 '+(s.check8?(s.bonus?'成功':'不成立'):'未実施'),
    'time    '+(s.started?s.elapsed.toFixed(2):'未開始')+(DBG.freeze?' [停止]':''),
    'rpm     '+Math.round(s.rpm)+(DBG.rpm?' [固定 '+DBG.rpm+']':''),
    '共鳴蓄積'+s.res.toFixed(3)+'  (1で最高回転)',
    '品質q   '+s.q.toFixed(3)+'  形 '+(s.shape?s.shape.score.toFixed(2):'-')+' 仕上 '+(s.shape?s.shape.craft.toFixed(2):'-'),
    '指標    '+(s.shape?s.shape.all.map(t=>t.d.n+(t.v*100|0)).join(' '):''),
    '価格    ¥'+fmt(s.priceTarget),
    '高さ    '+m.Htot.toFixed(1)+'mm',
    '最大径  '+(m.maxR*2).toFixed(1)+'mm',
    '最薄    '+(m.minT===null?'-':m.minT.toFixed(2)+'mm')+'  平均 '+(m.avgT===null?'-':m.avgT.toFixed(2)),
    '軸ブレ  '+(m.wob*100).toFixed(1)+'%',
    '特異点  質'+ok(s.q>=ZONE_Q)+' 回'+ok(s.rpm>=95000)+' 時'+ok(DBG.ignoreTime||s.elapsed>=PLAY_TIME-1)+' 崩'+ok(!s.collapsed),
    '設定    '+(DBG.noCollapse?'崩壊無効 ':'')+(DBG.ignoreTime?'時間条件無視':''),
    ...(TAS.log.length?['--- TAS ---'].concat(TAS.log.slice(-4)):[])
  ];
  DBG.out.textContent=lines.join('\n');
  const cur=TAS.on?TAS.name:'';
  if(cur!==DBG.tasMark){DBG.tasMark=cur;DBG.el.querySelectorAll('button[data-tas]').forEach(b=>{b.style.background=b.getAttribute('data-tas')===cur?'#c8371a':'#3a3631';});}
}
window.addEventListener('keydown',e=>{
  if(e.code==='Backquote'){if(!DBG.unlocked)return;e.preventDefault();dbgToggle();return;}
  if(!DBG.on)return;
  const ks=Object.keys(TAS_PLANS),c=e.key.toUpperCase();
  const i=/^[0-9]$/.test(c)?+c:(/^[A-Z]$/.test(c)?c.charCodeAt(0)-55:-1);
  if(i>=0&&i<ks.length){e.preventDefault();audioInit();tasStart(ks[i]);}
  else if(e.code==='Space'&&DBG.tasLast){e.preventDefault();tasStart(DBG.tasLast);}
});
// URLに ?debug か ?tas= があるときだけ解錠。開始前に左上（残り時間の辺り）を素早く5回タップしても解錠できる
DBG.unlocked=/[?&](debug\b|tas=)/.test(location.search);
{
  // 画面を覆う要素は置かず、開始前の左上タップだけを先取りする（プレイ中の操作は一切妨げない）
  let taps=[];
  window.addEventListener('pointerdown',e=>{
    if(!S||S.started||S.phase!=='play'||e.clientX>110||e.clientY>80)return;
    if(e.target&&e.target.closest&&e.target.closest('button,#dbg-panel,#zukan,#result'))return;
    e.stopPropagation();e.preventDefault();
    const now=performance.now();
    taps=taps.filter(t=>now-t<1500);taps.push(now);
    if(taps.length>=5){taps=[];DBG.unlocked=true;dbgToggle(true);toast('デバッグを解錠しました');}
  },true);
}
if(/[?&]debug\b/.test(location.search))dbgToggle(true);
{const mt=location.search.match(/[?&]tas=(\w+)/);if(mt&&TAS_PLANS[mt[1]])setTimeout(()=>tasStart(mt[1]),700);}

/* =========================================================
   メインループ
   ========================================================= */
function update(dt){
  const s=S;
  if(s.phase==='play'){
    tasStep(dt);
    simStep(dt,TAS.inputs);
    if(s.logD>=7){const rate=18+(s.logD-7)*30;if(Math.random()<rate*dt)spawnLeaf();if(Math.random()<rate*dt)spawnLeaf();}
    if(s.started&&s.elapsed>=PLAY_TIME){s.elapsed=PLAY_TIME;fire();}
    updateHUD();
    dbgUpdate();
    updateCamera(dt,false);
  }else{
    s.fireT+=dt;
    s.theta+=dt*Math.PI*2*0.4;
    if(s.phase==='firing'&&s.fireT>=0.6&&!s.resultShown)showResult();
    if(s.resultShown&&!s.shojiOpened&&s.fireT>=1.0){s.shojiOpened=true;shojiOpen();}
    if(s.phase==='result')updateResult(dt);
    dbgUpdate();
    camUpdateVP(cam);
  }
  let fo=0;
  if(s.phase!=='play'){
    const ft=s.fireT;
    fo=ft<0.06?ft/0.06:(ft<0.35?1:Math.max(0,1-(ft-0.35)/0.45));
  }
  flashEl.style.opacity=(fo*0.35).toFixed(3);
  updateParticles(dt);
  const amp=s.shake+(s.phase==='play'?((s.logD>=7?1+(s.logD-7)*1.8:0)+s.rpmF*s.rpmF*2):0);
  s.shake*=Math.exp(-dt*5);
  if(amp>0.3)stageEl.style.transform='translate('+((Math.random()-0.5)*amp*2).toFixed(1)+'px,'+((Math.random()-0.5)*amp*2).toFixed(1)+'px)';
  else if(stageEl.style.transform)stageEl.style.transform='';
  audioMotor(s.rpmF,s.phase==='play',Math.min(1,s.wob*3));
  if(s.phase!=='play')audioClay(0,0,0);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));
  last=now;T+=dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
S=newState();
window.addEventListener('resize',resize);
resize();
updateCamera(0,true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);
requestAnimationFrame(loop);
setTimeout(()=>shojiEl.classList.remove('closed'),300);
})();
